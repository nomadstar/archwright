name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n syntax check
        run: |
          set -e
          mapfile -t files < <(find bin lib scripts tests/integration -type f \( -name '*.sh' -o -name 'archwright' \))
          for f in "${files[@]}"; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: shellcheck
        run: |
          set -e
          # bin/archwright is checked with -x so shellcheck follows its
          # `source` statements (annotated with `# shellcheck source=...`)
          # into lib/contract.sh, lib/workspace.sh, lib/commands/*.sh and
          # analyzes that whole reachable graph as one unit -- otherwise
          # each file checked standalone falsely reports the other files'
          # only consumers as "declared but unused" (SC2034).
          shellcheck -x bin/archwright

          # lib/roles/*.sh and lib/providers/*.sh are intentionally NOT
          # followed from bin/archwright (contract.sh / workspace_publish.sh
          # source them via a runtime variable, annotated `source=/dev/null`
          # on purpose -- a role/provider is not known until the workspace
          # or --provider flag names one), so they're checked standalone
          # here, along with scripts and the integration test.
          mapfile -t standalone < <(find lib/roles lib/providers scripts tests/integration -type f -name '*.sh')
          shellcheck "${standalone[@]}"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the repository for accidentally-committed secrets or personal data
        run: ./scripts/check-secrets.sh

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update -y && sudo apt-get install -y bats
      - name: Run unit tests
        run: bats tests/unit/
